server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: order-service
  cloud:
    openfeign:
      client:
        config:
          stock-service:
            connectTimeout: 3000
            readTimeout: 5000
  datasource:
    url: "${ORDER_DB_URL:jdbc:mysql://127.0.0.1:3308/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}"
    username: ${ORDER_DB_USERNAME:order_user}
    password: ${ORDER_MYSQL_PASSWORD:order_local}
  sql:
    init:
      mode: always
      encoding: UTF-8
stock:
  service-url: ${STOCK_SERVICE_URL:http://127.0.0.1:8081}

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: seata_demo_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: XA
  config:
    type: file
  registry:
    type: file
  service:
    vgroup-mapping:
      seata_demo_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
