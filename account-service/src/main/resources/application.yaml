server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: account-service
  datasource:
    url: "${ACCOUNT_DB_URL:jdbc:mysql://127.0.0.1:3309/account_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}"
    username: ${ACCOUNT_DB_USERNAME:account_user}
    password: ${ACCOUNT_MYSQL_PASSWORD:account_local}
  sql:
    init:
      mode: always
      encoding: UTF-8
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: seata_demo_tx_group
  enable-auto-data-source-proxy: false
  data-source-proxy-mode: AT
  config:
    type: file
  registry:
    type: file
  service:
    vgroup-mapping:
      seata_demo_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
